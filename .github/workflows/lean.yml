name: Lean

on:
  push:
    branches: ["main", "cut/**"]
  pull_request:
    branches: ["main", "cut/**"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reject unfinished proofs
        run: |
          if grep -R -n --include='*.lean' -E '\bsorry\b|sorryAx' .; then
            exit 1
          fi
      - uses: leanprover/lean-action@v1
        with:
          build: true
          test: false
          lint: false
          use-mathlib-cache: false
      - name: Run axiom audit
        run: lake env lean Logos/Audit.lean
      - name: Run core boundary audit
        run: lake env lean Logos/CoreBoundaryAudit.lean
      - name: Run totality externality comparison audit
        run: lake env lean Logos/TotalityExternalityComparisonAudit.lean
      - name: Run totality externality scope audit
        run: lake env lean Logos/ScopeAudit.lean
      - name: Run totality externality boundary audit
        run: lake env lean Logos/TotalityExternalityBoundaryAudit.lean
      - name: Reject externality or A2/A3 regression in deep theorem
        run: |
          if grep -nE 'ExternalRegressTotalityAxioms|ExternalExplanationAxioms|FoundationAxioms|StructuralAxioms|NecessaryExistenceAxioms|NecessaryGroundAxioms|grounding_wellFounded|common_ground' Logos/Systems/TotalityExternality/ScopeTheorems.lean; then
            echo 'Deep TOTALITY-EXTERNALITY theorem reintroduced a forbidden premise or record.'
            exit 1
          fi
      - name: Run self-explanation audit
        run: lake env lean Logos/SelfExplanationAudit.lean
      - name: Run fact sufficient explanation audit
        run: lake env lean Logos/FactSufficientExplanationAudit.lean
      - name: Run contingent absolute audit
        run: lake env lean Logos/ContingentAbsoluteAudit.lean
      - name: Run grounded modality audit
        run: lake env lean Logos/GroundedModalityAudit.lean
      - name: Run carrier schema audit
        run: lake env lean Logos/CarrierSchemaAudit.lean
      - name: Run route seam audit
        run: lake env lean Logos/RouteSeamAudit.lean
      - name: Reject modal layer leaking into the totality argument
        run: |
          if grep -rnE 'ModalVariationModel|NoBruteModalVariationAt|ModallyUnconditionedFact|GroundedFailurePossible' Logos/Systems --include='*.lean' | grep -v '^Logos/Systems/GroundedModality/'; then
            echo 'GROUNDED-MODALITY contract 10.3: the modal layer entered a Systems module outside GroundedModality.'
            echo 'Either the modal axis was joined to the totality argument, which needs an explicit reviewed bridge, or 10.3 must be rewritten.'
            exit 1
          fi
      - name: Reject carrier assumptions in the schema layer
        run: |
          if grep -rnE 'Model\.|FactModel|RegressTotality|EntityExplanationModel|FactGroundingRoles' Logos/Ontology/Grounding/ScopeCarrier.lean Logos/Systems/CarrierSchema/Axioms.lean Logos/Systems/CarrierSchema/Theorems.lean; then
            echo 'CARRIER-SCHEMA: the carrier-neutral layer referred to entity, fact or regress structure.'
            echo 'That layer must stay independent of what populates the carrier; put the dependency in EntityInstance.lean instead.'
            exit 1
          fi
      - name: Reject new assumption records in the seam layer
        run: |
          if grep -rnE '^\s*(structure|class|axiom)\b' Logos/Systems/RouteSeam/; then
            echo 'ROUTE-SEAM: the seam layer declared a new record or axiom.'
            echo 'This cut must be a consequence of records already accepted on main.'
            exit 1
          fi
      - name: Run A4 fact independence audit
        run: lake env lean Logos/A4FactIndependenceAudit.lean
      - name: Reject new records in the A4 fact independence cut
        run: |
          if grep -nE '^\s*(structure|class|axiom)\b' Logos/Models/Grounding/A4FactIndependence.lean; then
            echo 'A4-FACT-INDEPENDENCE: the cut declared a record, class or axiom.'
            echo 'This cut must be models and one theorem over language already accepted on main.'
            exit 1
          fi
      - name: Run totality constitution audit
        run: lake env lean Logos/TotalityConstitutionAudit.lean
      - name: Reject new records in the totality constitution cut
        run: |
          if grep -nE '^\s*(structure|class|axiom)\b' Logos/Ontology/Grounding/TotalityConstitution.lean Logos/Systems/TotalityConstitution/Law.lean Logos/Systems/TotalityConstitution/Theorems.lean Logos/Models/Grounding/TotalityConstitution.lean; then
            echo 'TOTALITY-CONSTITUTION: the cut declared a new record or axiom.'
            exit 1
          fi
      - name: Reject imports of the totality constitution cut outside its own modules
        run: |
          if grep -rlE 'Logos\.(Ontology\.Grounding|Systems|Models\.Grounding)\.TotalityConstitution' Logos --include='*.lean' | grep -vE '^Logos/(Ontology/Grounding|Systems|Models/Grounding)/TotalityConstitution(/|\.lean)|^Logos/TotalityConstitutionAudit\.lean|^Logos/Models/Seam/ScottGrounding\.lean'; then
            echo 'TOTALITY-CONSTITUTION: a module outside the cut imports it.'
            echo 'The one exemption is the Scott seam, SCOTT-COLLAPSE-CONTRACT.md section 8; it may not use the constitution law.'
            exit 1
          fi
      - name: Run semantic line audit
        run: lake env lean Logos/SemanticLineAudit.lean
      - name: Reject grounding carriers in the semantic self-reference line
        run: |
          if grep -nE '\b(Entity|Fact|World|Grounding)\b' Logos/Ontology/Semantics/Language.lean Logos/Systems/InternalTruth/Axioms.lean Logos/Systems/InternalTruth/Theorems.lean Logos/Systems/SelfClosure/Axioms.lean Logos/Systems/SelfClosure/Theorems.lean Logos/Models/Semantics/InternalTruthIndependence.lean Logos/Models/Semantics/SelfClosure.lean; then
            echo 'SEMANTIC LINE: a grounding carrier or namespace appeared outside the seam module.'
            exit 1
          fi
      - name: Reject imports of the semantic self-reference line by the grounding line
        run: |
          if grep -rlE '^import Logos\.(Ontology\.Semantics|Systems\.InternalTruth|Systems\.SelfClosure|Models\.Semantics)' Logos --include='*.lean' | grep -vE '^Logos/(Ontology/Semantics|Systems/InternalTruth|Systems/SelfClosure|Models/Semantics|Models/Seam)/|^Logos/SemanticLineAudit\.lean'; then
            echo 'SEMANTIC LINE: a module outside the line and the seam imports it.'
            exit 1
          fi
      - name: Reject imports of the seam module
        run: |
          if grep -rlE '^import Logos\.Models\.Seam' Logos --include='*.lean' | grep -vE '^Logos/SemanticLineAudit\.lean'; then
            echo 'SEMANTIC LINE: the seam module must be a leaf.'
            exit 1
          fi
      - name: Run Scott collapse audit
        run: lake env lean Logos/ScottCollapseAudit.lean
      - name: Reject axioms and unexpected records in the Scott collapse cut
        run: |
          if grep -nE '^\s*axiom\b' Logos/Ontology/GoedelScott/Language.lean Logos/Systems/GoedelScott/Axioms.lean Logos/Systems/GoedelScott/Theorems.lean Logos/Models/GoedelScott/Independence.lean Logos/Models/Seam/ScottGrounding.lean; then
            echo 'SCOTT-COLLAPSE: a new file declared an axiom.'
            exit 1
          fi
          COUNT=$(cat Logos/Ontology/GoedelScott/Language.lean Logos/Systems/GoedelScott/Axioms.lean Logos/Systems/GoedelScott/Theorems.lean Logos/Models/GoedelScott/Independence.lean Logos/Models/Seam/ScottGrounding.lean | grep -cE '^\s*(structure|class)\b' || true)
          if [ "$COUNT" -ne 3 ]; then
            echo "SCOTT-COLLAPSE: expected exactly three structure declarations (Carrier, ScottCoreAxioms, ScottAxioms), found $COUNT."
            exit 1
          fi
      - name: Reject foreign imports on the GoedelScott line
        run: |
          if grep -hE '^import ' Logos/Ontology/GoedelScott/*.lean Logos/Systems/GoedelScott/*.lean Logos/Models/GoedelScott/*.lean | grep -vE '^import Logos\.(Logic\.|(Ontology|Systems|Models)\.GoedelScott\.)'; then
            echo 'SCOTT-COLLAPSE: a GoedelScott module imports something other than the logic layer and its own line.'
            exit 1
          fi
      - name: Reject imports of the GoedelScott line outside the line and its seam
        run: |
          if grep -rlE '^import Logos\.(Ontology|Systems|Models)\.GoedelScott' Logos --include='*.lean' | grep -vE '^Logos/(Ontology|Systems|Models)/GoedelScott/|^Logos/Models/Seam/ScottGrounding\.lean'; then
            echo 'SCOTT-COLLAPSE: a module outside the GoedelScott line and its seam imports the line.'
            exit 1
          fi
      - name: Reject the constitution law in the Scott seam
        run: |
          if grep -nE 'ConstitutedTotality|TotalityRequiresMembers' Logos/Models/Seam/ScottGrounding.lean; then
            echo 'SCOTT-COLLAPSE: the seam mentions the constitution law, which TOTALITY-CONSTITUTION-CONTRACT.md section 2 confines to its own cut.'
            exit 1
          fi
      - name: Reject theological tokens in the Scott collapse cut
        run: |
          if grep -niE '\b(god|godlike|divine|deity|theolog[a-z]*)\b' Logos/Ontology/GoedelScott/Language.lean Logos/Systems/GoedelScott/Axioms.lean Logos/Systems/GoedelScott/Theorems.lean Logos/Models/GoedelScott/Independence.lean Logos/Models/Seam/ScottGrounding.lean Logos/ScottCollapseAudit.lean; then
            echo 'SCOTT-COLLAPSE: a theological token appeared in the formal layer. Source names belong in the contract only.'
            exit 1
          fi
