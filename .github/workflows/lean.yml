name: Lean

on:
  push:
    branches: ["main", "cut/**"]
  pull_request:
    branches: ["main", "cut/**"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reject unfinished proofs
        run: |
          if grep -R -n --include='*.lean' -E '\bsorry\b|sorryAx' .; then
            exit 1
          fi
      - uses: leanprover/lean-action@v1
        with:
          build: true
          test: false
          lint: false
          use-mathlib-cache: false
      - name: Run axiom audit
        run: lake env lean Logos/Audit.lean
      - name: Run core boundary audit
        run: lake env lean Logos/CoreBoundaryAudit.lean
      - name: Run totality externality comparison audit
        run: lake env lean Logos/TotalityExternalityComparisonAudit.lean
      - name: Run totality externality scope audit
        run: lake env lean Logos/ScopeAudit.lean
      - name: Run totality externality boundary audit
        run: lake env lean Logos/TotalityExternalityBoundaryAudit.lean
      - name: Reject externality or A2/A3 regression in deep theorem
        run: |
          if grep -nE 'ExternalRegressTotalityAxioms|ExternalExplanationAxioms|FoundationAxioms|StructuralAxioms|NecessaryExistenceAxioms|NecessaryGroundAxioms|grounding_wellFounded|common_ground' Logos/Systems/TotalityExternality/ScopeTheorems.lean; then
            echo 'Deep TOTALITY-EXTERNALITY theorem reintroduced a forbidden premise or record.'
            exit 1
          fi
      - name: Run self-explanation audit
        run: lake env lean Logos/SelfExplanationAudit.lean
      - name: Run fact sufficient explanation audit
        run: lake env lean Logos/FactSufficientExplanationAudit.lean
      - name: Run carrier schema audit
        run: lake env lean Logos/CarrierSchemaAudit.lean
      - name: Reject carrier assumptions in the schema layer
        run: |
          if grep -rnE 'Model\.|FactModel|RegressTotality|EntityExplanationModel|FactGroundingRoles' Logos/Ontology/Grounding/ScopeCarrier.lean Logos/Systems/CarrierSchema/Axioms.lean Logos/Systems/CarrierSchema/Theorems.lean; then
            echo 'CARRIER-SCHEMA: the carrier-neutral layer referred to entity, fact or regress structure.'
            echo 'That layer must stay independent of what populates the carrier; put the dependency in EntityInstance.lean instead.'
            exit 1
          fi
